[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scoring-service"
version = "0.1.0"
description = "Local, auditable evidence scoring for individual SRE incident responses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "github-copilot-sdk>=1.0.13,<2",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyright>=1.1.380,<2"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
scoring-service = "scoring_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scoring_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["browser: browser interaction checks (requires the browser extra and an installed browser)"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
